[config]
schemaVersion = "0.0.1"

[package]
namespace = "JevMods"
name = "JevIntroSkip"
versionNumber = "1.0.5"
description = "Studio logos and cinematics hold up every launch, and a new character has to sit through the lore text and a long Valkyrie flight before it can move. This mod skips all of it."
websiteUrl = "https://github.com/JevMods/JevIntroSkip"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./package/icon.png"
readme = "./README.md"
outdir = "./dist"

[[build.copy]]
source = "./src/JevIntroSkip/bin/Release/JevIntroSkip.dll"
target = "/"

[[build.copy]]
source = "./package/CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "tweaks", "client-side" ]
